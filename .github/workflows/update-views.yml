# アニメ語り記事の「閲覧数」を毎日更新する（Cloudflare Web Analytics → _data/views.json → 記事HTMLを再生成）
# 必要な設定：リポジトリの Settings → Secrets and variables → Actions に CF_API_TOKEN と CF_ACCOUNT_ID を登録
name: 閲覧数の更新
on:
  schedule:
    - cron: "23 20 * * *"   # 毎日 5:23（日本時間）
  workflow_dispatch:         # Actions 画面から手動でも実行できる
permissions:
  contents: write
concurrency:
  group: update-views
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: APIキーの確認
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "::notice::CF_API_TOKEN / CF_ACCOUNT_ID が未設定のため、閲覧数の更新をスキップしました"
      - uses: actions/checkout@v4
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
      - uses: actions/setup-python@v5
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        with:
          python-version: "3.12"
      - name: 閲覧数を集計して記事を再生成
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          pip install markdown pyyaml
          python3 _tools/fetch_views.py
          python3 _tools/build.py
      - name: 変更があればコミット
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          git add _data/views.json anime anime.html sitemap.xml
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "閲覧数を更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          git push
